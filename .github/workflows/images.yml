# Builds the four container images and pushes them to ghcr.io/<owner>/boothdex-{api,worker,imgproxy,web}.
# Tags: `latest` and `sha-<short>` from master; `X.Y.Z` and `X.Y` from tags like v1.2.3.
name: images

on:
  push:
    branches: [master]
    tags: ["v*"]
    paths-ignore: ["**.md", "docs/**", "LICENSE"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: api, worker, imgproxy
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta-api
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/boothdex-api
          bake-target: meta-api
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - id: meta-worker
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/boothdex-worker
          bake-target: meta-worker
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - id: meta-imgproxy
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/boothdex-imgproxy
          bake-target: meta-imgproxy
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      # one compile, three images built in parallel (deploy/docker-bake.hcl)
      - uses: docker/bake-action@v7
        with:
          source: .
          files: |
            ./deploy/docker-bake.hcl
            cwd://${{ steps.meta-api.outputs.bake-file }}
            cwd://${{ steps.meta-worker.outputs.bake-file }}
            cwd://${{ steps.meta-imgproxy.outputs.bake-file }}
          push: true
          set: |
            *.cache-from=type=gha,scope=rust
            *.cache-to=type=gha,scope=rust,mode=max

  web:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/boothdex-web
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/web.Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max
