name: test

on:
  push:
    branches: [master]
    paths: &paths
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/**"
      - "web/**"
      - ".github/workflows/test.yml"
      - "!**/*.md"
  pull_request:
    paths: *paths
  workflow_dispatch:

jobs:
  rust:
    name: rust
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_PASSWORD: dev
          POSTGRES_DB: catalogue
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace -- --include-ignored
        env:
          DATABASE_URL: postgres://postgres:dev@localhost:5432/catalogue
      # the container images encode AVIF with libaom (imgproxy's libavif feature); the plain build above uses rav1e
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libavif-dev pkg-config
      - run: cargo test -p imgproxy --features libavif

  web:
    name: web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun test
      # PageProps / LayoutProps are generated route types (normally written by next dev/build)
      - run: bunx next typegen
      - run: bunx tsc --noEmit
