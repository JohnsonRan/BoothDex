[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "AGPL-3.0-or-later"
publish = false

[workspace.dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
pgvector = { version = "0.4.2", default-features = false, features = ["sqlx", "halfvec"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.9", default-features = false, features = ["postgres", "runtime-tokio", "tls-rustls", "json", "chrono", "migrate", "macros"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
boothdex-core = { path = "crates/core" }
