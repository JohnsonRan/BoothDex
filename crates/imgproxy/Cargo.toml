[package]
name = "imgproxy"
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

[features]
# rav1e's hand-written assembly: about three times faster AVIF encoding. On x86_64 it needs nasm at build time, so it
# is off by default (cargo build works on a bare toolchain) and the container build turns it on.
asm = ["image/nasm"]

[dependencies]
anyhow.workspace = true
axum = "0.8"
foyer = "0.22"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "avif", "rayon"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "http2"] }
serde.workspace = true
serde_json.workspace = true
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
tokio = { workspace = true, features = ["fs", "sync"] }
