[package]
name = "imgproxy"
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

[features]
# AVIF from libaom, through the system's libavif, instead of rav1e: at the same score its files are about a sixth
# smaller, and it encodes faster. It needs libavif (1.0 or later) and pkg-config at build time and libavif at run
# time, so it is off by default (cargo build works on a bare toolchain) and the container build turns it on.
libavif = ["dep:cc", "dep:pkg-config"]
# rav1e's hand-written assembly, for a build without libavif: about three times faster AVIF encoding. On x86_64
# it needs nasm at build time.
asm = ["image/nasm"]

[dependencies]
anyhow.workspace = true
boothdex-limit.workspace = true
axum = "0.8"
foyer = "0.22"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "avif", "rayon"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "http2"] }
serde.workspace = true
serde_json.workspace = true
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
tokio = { workspace = true, features = ["fs", "net", "sync"] }

[build-dependencies]
cc = { version = "1", optional = true }
pkg-config = { version = "0.3", optional = true }
