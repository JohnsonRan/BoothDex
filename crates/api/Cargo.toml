[package]
name = "api"
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
anyhow.workspace = true
arc-swap = "1"
futures-util = { version = "0.3", default-features = false }
sysinfo = { version = "0.40", default-features = false, features = ["system", "disk"] }
argon2 = "0.6"
getrandom = "0.4"
sha2 = "0.11"
axum = { version = "0.8", features = ["tokio", "http1", "json", "query"] }
boothdex-core.workspace = true
chrono.workspace = true
lindera = { version = "6.2", features = ["embed-ipadic"] }
mimalloc = "0.1.52"
moka = { version = "0.12", features = ["sync"] }
percent-encoding = "2"
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "json", "http2"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
lindera-tantivy = { version = "6.2", features = ["embed-ipadic"] }
roaring = "0.12"
rustc-hash = "2.1"
serde.workspace = true
serde_json.workspace = true
sqlx.workspace = true
tantivy = "0.27"
tokio = { workspace = true, features = ["sync", "time", "signal"] }
tower-http = { version = "0.7", features = ["cors", "compression-gzip"] }

[dev-dependencies]
ts-rs = { version = "12", features = ["chrono-impl", "serde-json-impl"] }
