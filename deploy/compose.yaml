# Production stack. Copy deploy/.env.example to deploy/.env and fill it in first.
#   cd deploy && docker compose pull && docker compose up -d     (prebuilt images from ghcr.io)
#   cd deploy && docker compose up -d --build                    (build from this checkout instead)
# podman compose works the same way.
# Start order is handled by depends_on: postgres -> api/worker/imgproxy -> web.
# Only web is meant to be reached from outside (WEB_LISTEN); it forwards /api and /img to api and imgproxy.
# Put your own reverse proxy (TLS) or a tunnel in front of it. The other services listen on 127.0.0.1 only.
name: boothdex

services:
  postgres:
    image: docker.io/pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_DB: catalogue
      POSTGRES_USER: catalogue
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./restore:/restore:ro # put catalogue.dump here for the first restore
    ports: ["127.0.0.1:5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U catalogue -d catalogue"]
      interval: 5s
      retries: 20
    shm_size: 256mb

  api:
    image: ghcr.io/johnsonran/boothdex-api:${BOOTHDEX_TAG:-latest}
    build: { context: .., dockerfile: deploy/Dockerfile, target: api }
    restart: unless-stopped
    depends_on: { postgres: { condition: service_healthy } }
    environment:
      # password passed separately: base64 passwords contain / + = that would break the URL
      DATABASE_URL: postgres://catalogue@postgres:5432/catalogue
      PGPASSWORD: ${POSTGRES_PASSWORD}
      SITE_URL: ${SITE_URL:?set SITE_URL in .env}
      ADMIN_USERNAMES: ${ADMIN_USERNAMES:-}
      IMGPROXY_URL: http://imgproxy:3001
      COOKIE_SECURE: ${COOKIE_SECURE:-1}
      # optional: override the AI settings from the admin console (keeps the key out of the database)
      AI_API_KEY: ${AI_API_KEY:-}
      AI_BASE_URL: ${AI_BASE_URL:-}
      AI_MODEL: ${AI_MODEL:-}
      AI_REASONING_EFFORT: ${AI_REASONING_EFFORT:-}
    volumes:
      - textindex:/index # on-disk search index, reused across restarts
    ports: ["127.0.0.1:3000:3000"]
    # ~0.5 GB steady, ~1.6 GB peak while (re)building; a hot reload briefly holds old + new
    mem_limit: 3g

  worker:
    image: ghcr.io/johnsonran/boothdex-worker:${BOOTHDEX_TAG:-latest}
    build: { context: .., dockerfile: deploy/Dockerfile, target: worker }
    restart: unless-stopped
    depends_on: { postgres: { condition: service_healthy } }
    environment:
      DATABASE_URL: postgres://catalogue@postgres:5432/catalogue
      PGPASSWORD: ${POSTGRES_PASSWORD}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_BASE_URL: ${AI_BASE_URL:-}
      AI_MODEL: ${AI_MODEL:-}
      AI_REASONING_EFFORT: ${AI_REASONING_EFFORT:-}
    mem_limit: 512m

  imgproxy:
    image: ghcr.io/johnsonran/boothdex-imgproxy:${BOOTHDEX_TAG:-latest}
    build: { context: .., dockerfile: deploy/Dockerfile, target: imgproxy }
    restart: unless-stopped
    environment:
      ARCHIVE_IMAGES: /archive
      CACHE_DISK_MB: ${IMG_CACHE_DISK_MB:-10240}
      CACHE_MEM_MB: ${IMG_CACHE_MEM_MB:-256}
    volumes:
      - ${ARCHIVE_IMAGES_DIR:?set ARCHIVE_IMAGES_DIR in .env}:/archive:ro
      - imgcache:/cache
    ports: ["127.0.0.1:3001:3001"]
    mem_limit: 1g

  web:
    image: ghcr.io/johnsonran/boothdex-web:${BOOTHDEX_TAG:-latest}
    build: { context: .., dockerfile: deploy/web.Dockerfile }
    restart: unless-stopped
    depends_on: [api, imgproxy]
    # "[address:]port" on the host; e.g. 127.0.0.1:3100 when a reverse proxy on the same host is the only client
    ports: ["${WEB_LISTEN:-3100}:3100"]

volumes:
  pgdata:
  textindex:
  imgcache:
