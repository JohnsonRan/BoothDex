# Production stack. Copy deploy/.env.example to .env and fill it in first.
#   docker compose pull && docker compose up -d          (prebuilt images from ghcr.io; only compose.yaml + .env needed)
#   docker compose up -d --build                         (build from a full repo checkout instead)
# podman compose works the same way.
# Start order is handled by depends_on: postgres -> api/worker/imgproxy -> web.
# Only web is meant to be reached from outside (WEB_LISTEN); it forwards /api and /img to api and imgproxy.
# Put your own reverse proxy (TLS) or a tunnel in front of it. The other services publish no ports: they are
# reachable only on the compose network (use `docker compose exec` for maintenance).
name: boothdex

# Docker keeps 3 × 10 MB per service; Podman caps each log at 10 MB (older lines are dropped)
x-logging: &logging
  driver: json-file
  options: { max-size: 10m, max-file: "3" }

services:
  postgres:
    image: docker.io/pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_DB: catalogue
      POSTGRES_USER: catalogue
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U catalogue -d catalogue"]
      interval: 5s
      retries: 20
    shm_size: 256mb
    logging: *logging

  api:
    image: ghcr.io/johnsonran/boothdex-api:${BOOTHDEX_TAG:-latest}
    build: { context: .., dockerfile: deploy/Dockerfile, target: api }
    restart: unless-stopped
    depends_on: { postgres: { condition: service_healthy } }
    environment:
      # password passed separately: base64 passwords contain / + = that would break the URL
      DATABASE_URL: postgres://catalogue@postgres:5432/catalogue
      PGPASSWORD: ${POSTGRES_PASSWORD}
      SITE_URL: ${SITE_URL:?set SITE_URL in .env}
      ADMIN_USERNAMES: ${ADMIN_USERNAMES:-}
      IMGPROXY_URL: http://imgproxy:3001
      COOKIE_SECURE: ${COOKIE_SECURE:-1}
      # optional: override the AI settings from the admin console (keeps the key out of the database)
      AI_API_KEY: ${AI_API_KEY:-}
      AI_BASE_URL: ${AI_BASE_URL:-}
      AI_MODEL: ${AI_MODEL:-}
      AI_REASONING_EFFORT: ${AI_REASONING_EFFORT:-}
      AI_EMBED_MODEL: ${AI_EMBED_MODEL:-}
    volumes:
      - textindex:/index # on-disk search index, reused across restarts
    logging: *logging
    # ~0.4-1 GB steady on Linux with mimalloc, ~1.8 GB peak while reloading (old and new catalogue held at once);
    # with glibc malloc 3g was OOM-killed, so the limit keeps that headroom
    mem_limit: 4g

  worker:
    image: ghcr.io/johnsonran/boothdex-worker:${BOOTHDEX_TAG:-latest}
    build: { context: .., dockerfile: deploy/Dockerfile, target: worker }
    restart: unless-stopped
    depends_on: { postgres: { condition: service_healthy } }
    environment:
      DATABASE_URL: postgres://catalogue@postgres:5432/catalogue
      PGPASSWORD: ${POSTGRES_PASSWORD}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_BASE_URL: ${AI_BASE_URL:-}
      AI_MODEL: ${AI_MODEL:-}
      AI_REASONING_EFFORT: ${AI_REASONING_EFFORT:-}
      AI_EMBED_MODEL: ${AI_EMBED_MODEL:-}
    mem_limit: 512m
    logging: *logging

  imgproxy:
    image: ghcr.io/johnsonran/boothdex-imgproxy:${BOOTHDEX_TAG:-latest}
    build: { context: .., dockerfile: deploy/Dockerfile, target: imgproxy }
    restart: unless-stopped
    environment:
      ARCHIVE_IMAGES: /archive
      CACHE_DISK_MB: ${IMG_CACHE_DISK_MB:-10240}
      CACHE_MEM_MB: ${IMG_CACHE_MEM_MB:-256}
    volumes:
      - ${ARCHIVE_IMAGES_DIR:-archive}:/archive:ro
      - imgcache:/cache
    mem_limit: 1g
    logging: *logging

  web:
    image: ghcr.io/johnsonran/boothdex-web:${BOOTHDEX_TAG:-latest}
    build: { context: .., dockerfile: deploy/web.Dockerfile }
    restart: unless-stopped
    depends_on: [api, imgproxy]
    environment:
      SITE_URL: ${SITE_URL:?set SITE_URL in .env}
      OPERATOR_NAME: ${OPERATOR_NAME:-}
      CONTACT_EMAIL: ${CONTACT_EMAIL:-}
    # "[address:]port" on the host; loopback by default, for a reverse proxy on the same host. A bare port publishes on all interfaces.
    ports: ["${WEB_LISTEN:-127.0.0.1:3100}:3100"]
    logging: *logging

volumes:
  pgdata:
  textindex:
  imgcache:
  archive:
