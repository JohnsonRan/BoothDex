# Production stack. Copy deploy/.env.example to deploy/.env and fill it in first.
#   cd deploy && docker compose up -d --build        (or: podman compose ...)
# Start order is handled by depends_on: postgres -> api/worker/imgproxy -> web -> caddy.
name: catalogue

services:
  postgres:
    image: docker.io/pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_DB: catalogue
      POSTGRES_USER: catalogue
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./restore:/restore:ro # put catalogue.dump here for the first restore
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U catalogue -d catalogue"]
      interval: 5s
      retries: 20
    shm_size: 256mb

  api:
    build: { context: .., dockerfile: deploy/Dockerfile, target: api }
    restart: unless-stopped
    depends_on: { postgres: { condition: service_healthy } }
    environment:
      DATABASE_URL: postgres://catalogue:${POSTGRES_PASSWORD}@postgres:5432/catalogue
      SITE_URL: ${SITE_URL:?set SITE_URL in .env}
      ADMIN_USERNAMES: ${ADMIN_USERNAMES:-}
      IMGPROXY_URL: http://imgproxy:3001
      COOKIE_SECURE: "1"
      # optional: override the AI settings from the admin console (keeps the key out of the database)
      AI_API_KEY: ${AI_API_KEY:-}
      AI_BASE_URL: ${AI_BASE_URL:-}
      AI_MODEL: ${AI_MODEL:-}
      AI_REASONING_EFFORT: ${AI_REASONING_EFFORT:-}
    volumes:
      - textindex:/index # on-disk search index, reused across restarts
    # ~0.5 GB steady, ~1.6 GB peak while (re)building; a hot reload briefly holds old + new
    mem_limit: 3g

  worker:
    build: { context: .., dockerfile: deploy/Dockerfile, target: worker }
    restart: unless-stopped
    depends_on: { postgres: { condition: service_healthy } }
    environment:
      DATABASE_URL: postgres://catalogue:${POSTGRES_PASSWORD}@postgres:5432/catalogue
      AI_API_KEY: ${AI_API_KEY:-}
      AI_BASE_URL: ${AI_BASE_URL:-}
      AI_MODEL: ${AI_MODEL:-}
      AI_REASONING_EFFORT: ${AI_REASONING_EFFORT:-}
    mem_limit: 512m

  imgproxy:
    build: { context: .., dockerfile: deploy/Dockerfile, target: imgproxy }
    restart: unless-stopped
    environment:
      ARCHIVE_IMAGES: /archive
      CACHE_DISK_MB: ${IMG_CACHE_DISK_MB:-10240}
      CACHE_MEM_MB: ${IMG_CACHE_MEM_MB:-256}
    volumes:
      - ${ARCHIVE_IMAGES_DIR:?set ARCHIVE_IMAGES_DIR in .env}:/archive:ro
      - imgcache:/cache
    mem_limit: 1g

  web:
    build: { context: .., dockerfile: deploy/web.Dockerfile }
    restart: unless-stopped
    depends_on: [api]

  caddy:
    image: docker.io/library/caddy:2
    restart: unless-stopped
    depends_on: [web, api, imgproxy]
    ports: ["80:80", "443:443"]
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:?set SITE_DOMAIN in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data

volumes:
  pgdata:
  textindex:
  imgcache:
  caddydata:
